[project]
name = "group-toolkit"
version = "0.1.0"
description = "A toolkit for finite groups: axioms, subgroups, cosets, normality, quotients, conjugacy, isomorphism"
requires-python = ">=3.9"

[project.optional-dependencies]
viz = ["matplotlib", "networkx"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
